name: BIMZZ Bot AI

on:
  schedule:
    - cron: '0 */5 * * *'  # Restart tiap 5 jam
  workflow_dispatch:  # Bisa manual trigger
  push:
    branches: [main]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Max 6 jam (GitHub limit 360 menit)
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Requirements
        run: pip install -r requirements.txt
      
      - name: Run Bot
        run: |
          timeout 21000 python bot.py || true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
